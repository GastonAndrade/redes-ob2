frr defaults traditional
hostname r2
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
router ospf
 ospf router-id 2.2.2.2
 network 10.100.0.12/30 area 0
 network 10.100.0.16/30 area 0
 network 10.100.0.24/30 area 0
 network 10.100.0.28/30 area 0
!
interface eth0
 ip ospf cost 10
interface eth1
 ip ospf cost 6
interface eth2
 ip ospf cost 7
interface eth3
 ip ospf cost 4