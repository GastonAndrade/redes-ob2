frr defaults traditional
hostname r3
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
ip route 203.0.113.8/30 192.168.27.2
router ospf
 ospf router-id 3.3.3.3
 network 10.100.0.20/30 area 0
 network 10.100.0.24/30 area 0
 network 10.100.0.36/30 area 0
 network 192.168.27.0/30 area 0
 passive-interface eth3
 redistribute static
!
interface eth0
 ip ospf cost 5
interface eth1
 ip ospf cost 6
interface eth2
 ip ospf cost 4