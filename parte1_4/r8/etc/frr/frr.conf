frr defaults traditional
hostname r8
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
router ospf
 ospf router-id 8.8.8.8
 network 10.100.0.52/30 area 0
 network 10.100.0.48/30 area 0
 network 203.0.113.16/30 area 0
 passive-interface eth2
!
interface eth0
 ip ospf cost 5
interface eth1
 ip ospf cost 5
