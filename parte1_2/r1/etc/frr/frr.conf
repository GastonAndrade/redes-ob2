frr defaults traditional
hostname r1
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
ip route 0.0.0.0/0 10.100.0.1
router ospf
 ospf router-id 1.1.1.1
 network 10.100.0.0/30 area 0
 network 10.100.0.12/30 area 0
 network 10.100.0.20/30 area 0
 passive-interface eth0
 default-information originate
!
interface eth1
 ip ospf cost 10
interface eth2
 ip ospf cost 5