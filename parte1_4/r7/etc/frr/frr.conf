frr defaults traditional
hostname r7
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
router ospf
 ospf router-id 7.7.7.7
 network 10.100.0.56/30 area 0
 network 10.100.0.44/30 area 0
 network 10.100.0.52/30 area 0
!
interface eth0
 ip ospf cost 5
interface eth1
 ip ospf cost 5
interface eth2
 ip ospf cost 5
