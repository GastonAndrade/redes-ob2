frr defaults traditional
hostname r6
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
ip route 0.0.0.0/0 10.100.0.5
router ospf
 ospf router-id 6.6.6.6
 network 10.100.0.8/30 area 0
 network 10.100.0.32/30 area 0
 network 10.100.0.4/30 area 0
 network 10.100.0.56/30 area 0
 passive-interface eth0
 default-information originate
!
interface eth1
 ip ospf cost 5
interface eth2
 ip ospf cost 5
interface eth3
 ip ospf cost 5
