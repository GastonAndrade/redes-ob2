frr defaults traditional
hostname r4
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
router ospf
 ospf router-id 4.4.4.4
 network 10.100.0.8/30 area 0
 network 10.100.0.16/30 area 0
 network 10.100.0.40/30 area 0
!
interface eth0
 ip ospf cost 7
interface eth1
 ip ospf cost 8
interface eth2
 ip ospf cost 5
