frr defaults traditional
hostname r5
log file /var/log/frr/frr.log
!
! Configuración OSPF a completar por el grupo.
!
ip route 203.0.113.0/30 192.168.27.6
router ospf
 ospf router-id 5.5.5.5
 network 10.100.0.28/30 area 0
 network 10.100.0.32/30 area 0
 network 10.100.0.40/30 area 0
 network 10.100.0.36/30 area 0
 network 192.168.27.4/30 area 0
 passive-interface eth4
 redistribute static
!
interface eth0
 ip ospf cost 4
interface eth1
 ip ospf cost 4
interface eth2
 ip ospf cost 8
interface eth3
 ip ospf cost 12